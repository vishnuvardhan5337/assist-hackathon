[project]
name = "assist"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["openai", "python-dotenv", "chromadb>=1.0"]

[project.scripts]
assist = "assist.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["assist"]
